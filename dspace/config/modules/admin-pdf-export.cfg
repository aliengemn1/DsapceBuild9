#---------------------------------------------------------------#
#-----------ADMIN PDF EXPORT CONFIGURATION----------------------#
#---------------------------------------------------------------#
# Configuration for Admin PDF Export feature
# This feature allows authorized admin users to export portions of PDF files

# Whether the admin PDF export feature is enabled
# Set to true to enable, false to disable
admin.pdf.export.enabled = true

# List of group names that are allowed to use admin PDF export
# Users must be a member of at least one of these groups
# Multiple groups can be specified, comma-separated
admin.pdf.export.allowed.groups = Administrator

# Percentage of pages to export in "first X%" mode (0.0 to 1.0)
# For example, 0.25 means 25% of the total pages
admin.pdf.export.percentage = 0.25

# Maximum percentage of total pages that can be exported with custom page selection (0.0 to 1.0)
# For example, 0.25 means users can select up to 25% of total pages
admin.pdf.export.max.custom.percentage = 0.25

# Time window in minutes to check for duplicate export requests
# If a user requests the same bitstream within this window, the request is rejected
# This helps prevent abuse of the export feature
admin.pdf.export.duplicate.window.minutes = 5
